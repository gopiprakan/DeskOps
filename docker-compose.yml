services:
  db:
    image: postgres:16
    container_name: deskops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deskops
      POSTGRES_PASSWORD: deskops_dev
      POSTGRES_DB: deskops
    ports:
      - "5432:5432"
    volumes:
      - deskops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskops -d deskops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: deskops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  deskops_pgdata:
